[package]
name = "niubackup-desktop"
version = "0.1.0"
description = "牛备 NiuBackup — PC desktop shell (Tauri) driving the Java receiver engine"
edition = "2021"

[lib]
name = "niubackup_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
