[package]
name = "niubackup-desktop"
version = "0.1.0"
description = "牛备 NiuBackup — PC desktop shell (Tauri) driving the Java receiver engine"
edition = "2021"

[lib]
name = "niubackup_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol is load-bearing: without it a plain `cargo build`
# produces a DEV-mode binary that loads build.devUrl
# (http://localhost:1420) instead of the embedded frontendDist — the
# window then shows WebKit's "Could not connect to localhost" error
# page and the frontend never runs. (The Tauri CLI enables this
# feature implicitly; bare cargo does not.)
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
