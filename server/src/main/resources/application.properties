spring.application.name=niubackup-server
# Primary bind: loopback only. An additional Tomcat connector binds the mesh
# address when NB_MESH_ADDR is set (see NiuServerApplication). The public
# interface is deliberately NOT bound; HTTPS via a domain is the pre-launch step.
server.address=127.0.0.1
server.port=${NB_PORT:18090}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/niubackup}
spring.datasource.username=${DB_USER:niubackup}
spring.datasource.password=${DB_PASS:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000

# Public mesh node handed to clients in provisioning responses.
nb.public-node=${NB_PUBLIC_NODE:tcp://36.133.114.164:11011}
# Extra bind address for the mesh-facing connector (empty = disabled).
nb.mesh-addr=${NB_MESH_ADDR:}

logging.level.root=INFO
logging.level.cn.niubackup=INFO
