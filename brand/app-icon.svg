<?xml version="1.0" encoding="UTF-8"?>
<!-- NiuBackup （牛备） app icon — master artwork, 1024x1024.
     Geometric bull head (white silhouette) with the brand's orange
     up-arrow on the forehead, on a deep-teal rounded square.
     Brand colors: deep teal #0A4757 -> #0E6B7E, accent orange #F07F13.
     Derived assets (Android mipmaps, Tauri icons) are rendered from
     this file; see brand/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#0E6B7E"/>
      <stop offset="100%" stop-color="#0A4757"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Bull head silhouette (single geometric polygon, symmetric about x=512):
       horns sweep up-out at the top corners, ears spike out mid-height,
       cheeks taper to the muzzle point at bottom center. -->
  <path fill="#FFFFFF" d="M 172 196 L 352 228 L 398 348 L 512 326 L 626 348 L 672 228 L 852 196 L 700 372 L 898 462 L 726 528 L 700 640 L 512 868 L 324 640 L 298 528 L 126 462 L 324 372 Z"/>
  <!-- Orange up-arrow on the forehead (upload = backup to your own PC). -->
  <path fill="#F07F13" d="M 512 352 L 672 508 L 580 508 L 580 706 L 444 706 L 444 508 L 352 508 Z"/>
</svg>
