<?xml version="1.0" encoding="UTF-8"?>
<!-- NiuBackup app icon — adaptive-icon BACKGROUND layer: the brand
     deep-teal gradient as a full square (no rounded corners; the
     launcher applies its own mask). Render ic_launcher_background.png
     at 108/162/216/324/432 px from this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#0E6B7E"/>
      <stop offset="100%" stop-color="#0A4757"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
</svg>
