# NiuBackup PC packages (M4c) — jpackage app images for Windows / macOS / Linux.
#
# Every job mirrors the exact steps verified locally on the Linux laptop:
#   fetch sqlite-jdbc + slf4j jars -> compile receiver+sender -> stage input
#   (fat classpath jars, dependency jars, easytier-core sidecar) -> jpackage
#   --type app-image -> upload the app dir as an artifact.
#
# The easytier-core release assets are the official EasyTier v2.6.4 zips
# (asset names verified 2026-10-31). ffmpeg static builds are fetched
# best-effort (continue-on-error): the receiver uses ffmpeg from PATH for
# video thumbnails, so a bundled copy is a convenience, not a hard dep.
# ImageMagick is NOT bundled: no straightforward official standalone binary
# exists for Linux/macOS (Windows has an installer, not a portable zip) —
# HEIC thumbnails use it only when present on the system PATH.
#
# Code signing is intentionally skipped (dev stage): Windows SmartScreen
# and macOS Gatekeeper will warn on first run; see docs/m4c-notes.md.

name: pc-packages

on:
  workflow_dispatch:
  push:
    tags: ["pc-v*"]

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            et_asset: easytier-linux-x86_64-v2.6.4.zip
            et_bin: easytier-core
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          - os: windows-latest
            et_asset: easytier-windows-x86_64-v2.6.4.zip
            et_bin: easytier-core.exe
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          # macos-14 runners are arm64; Intel macs use the x86_64 asset via Rosetta-era builds.
          - os: macos-14
            et_asset: easytier-macos-aarch64-v2.6.4.zip
            et_bin: easytier-core
            ffmpeg_url: https://evermeet.cx/ffmpeg/getrelease/zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch dependency jars
        shell: bash
        run: |
          mkdir -p lib stage
          curl -fL -o lib/sqlite-jdbc-3.47.1.0.jar \
            https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.47.1.0/sqlite-jdbc-3.47.1.0.jar
          curl -fL -o lib/slf4j-api-2.0.16.jar \
            https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar

      - name: Compile receiver + PC app + sender
        shell: bash
        run: |
          mkdir -p out-pc out-sender
          javac -cp "lib/sqlite-jdbc-3.47.1.0.jar:lib/slf4j-api-2.0.16.jar" \
            -d out-pc receiver/BackupReceiver.java receiver/NiuPcApp.java
          javac -d out-sender sender/BackupSender.java
          (cd out-pc && jar --create --file ../stage/niubackup-pc.jar --main-class NiuPcApp .)
          (cd out-sender && jar --create --file ../stage/niubackup-sender.jar --main-class BackupSender .)
          cp lib/sqlite-jdbc-3.47.1.0.jar lib/slf4j-api-2.0.16.jar stage/

      - name: Fetch easytier-core sidecar (v2.6.4)
        shell: bash
        run: |
          curl -fL -o et.zip \
            "https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/${{ matrix.et_asset }}"
          mkdir -p et && unzip -o et.zip -d et
          ET=$(find et -name '${{ matrix.et_bin }}' | head -1)
          cp "$ET" stage/
          chmod +x "stage/${{ matrix.et_bin }}" || true

      - name: Fetch ffmpeg (best effort, thumbnails)
        continue-on-error: true
        shell: bash
        run: |
          curl -fL -o ffmpeg-dl "${{ matrix.ffmpeg_url }}"
          mkdir -p ff
          (unzip -o ffmpeg-dl -d ff || tar -xf ffmpeg-dl -C ff) || true
          FF=$(find ff -name 'ffmpeg*' -type f | grep -v '\.' || find ff -name 'ffmpeg' -o -name 'ffmpeg.exe' | head -1)
          [ -n "$FF" ] && cp "$FF" stage/ || true

      - name: jpackage app image
        shell: bash
        run: |
          jpackage --type app-image --name NiuBackup \
            --input stage --main-jar niubackup-pc.jar --main-class NiuPcApp \
            --dest dist --app-version 0.4.0 \
            --description "NiuBackup PC receiver"

      - name: Smoke check (launcher starts headless serve usage)
        shell: bash
        run: |
          ls dist/NiuBackup || ls dist
          # The packaged runtime must at least load the main class:
          ./dist/NiuBackup/NiuBackup --serve --help 2>&1 | head -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: niubackup-pc-${{ matrix.os }}
          path: dist/
